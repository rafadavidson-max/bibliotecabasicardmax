name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"


- name: Create Markdown Table
  # You may pin to the exact commit or the version.
  # uses: gazab/create-markdown-table@bb8887f1b04e2f0299ce02da54e698ac6f59fd34
  uses: gazab/create-markdown-table@v1.0.6
  with:
    # path to the JSON/YAML file to create a table from
    file: 
    # List of columns and their order to include in the table. Use JSON format.
    columns: # optional
    # Capitalize the first letter of each column name in the header. Default: true
    capitalize: # optional, default is true
