<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca Básica">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Biblioteca Básica</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
  header { background: #4f46e5; color: #fff; padding: 16px; text-align: center; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 14px; opacity: .9; }
  .container { display: flex; max-width: 1000px; margin: 16px auto; gap: 16px; padding: 0 12px; align-items: flex-start; }
  aside { width: 170px; flex-shrink: 0; background: #fff; border-radius: 10px; padding: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); display: flex; flex-direction: column; gap: 4px; max-height: 80vh; overflow-y: auto; }
  aside h2 { font-size: 13px; color: #666; margin: 8px 8px 4px; text-transform: uppercase; letter-spacing: .5px; }
  .aba { text-align: left; background: transparent; color: #333; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; border: 0; }
  .aba:hover { background: #eef2ff; }
  .aba.ativa { background: #4f46e5; color: #fff; }
  .aba small { display: block; font-size: 12px; opacity: .75; }
  main { flex: 1; min-width: 0; }
  form, .book { background: #fff; padding: 16px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  input { padding: 8px; margin: 4px 0; border: 1px solid #ccc; border-radius: 6px; max-width: 100%; }
  button { padding: 8px 12px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; cursor: pointer; }
  button.danger { background: #dc2626; }
  .bar { height: 12px; background: #e5e7eb; border-radius: 6px; overflow: hidden; margin: 8px 0; }
  .fill { height: 100%; background: #22c55e; transition: width .3s; }
  .done { opacity: .85; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .datas { font-size: 14px; color: #555; margin-top: 6px; }
  label { font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
  .vazio { color: #777; text-align: center; padding: 24px; background: #fff; border-radius: 10px; }
  @media (max-width: 600px) {
    .container { flex-direction: column; }
    aside { width: 100%; flex-direction: row; overflow-x: auto; max-height: none; }
    aside h2 { display: none; }
    .aba { white-space: nowrap; }
  }
</style>
</head>
<body>
<header>
  <h1>Biblioteca Básica</h1>
  <p id="resumo"></p>
</header>

<div class="container">
  <aside id="abas"></aside>

  <main>
    <form id="form">
      <input id="titulo" placeholder="Título do livro" required>
      <input id="autor" placeholder="Autor (opcional)">
      <input id="total" type="number" min="1" placeholder="Número total de páginas" required>
      <label>Data de início (opcional)
        <input id="inicio" type="date">
      </label>
      <button>Adicionar livro</button>
    </form>

    <div id="lista"></div>
  </main>
</div>

<script>
  let livros = JSON.parse(localStorage.getItem('bibliotecaBasica')) || [];
  let abaAtiva = 'andamento';

  const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  const hoje = () => new Date().toISOString().slice(0, 10);

  function formatar(data) {
    if (!data) return '—';
    const [a, m, d] = data.split('-');
    return `${d}/${m}/${a}`;
  }

  function salvar() {
    localStorage.setItem('bibliotecaBasica', JSON.stringify(livros));
    render();
  }

  function escapar(texto) {
    const d = document.createElement('div');
    d.textContent = texto;
    return d.innerHTML;
  }

  // Chave da aba: "andamento" ou "AAAA-MM" pela data de fim
  function chaveDoLivro(l) {
    if (!l.lido || !l.fim) return 'andamento';
    return l.fim.slice(0, 7);
  }

  function nomeDaAba(chave) {
    if (chave === 'andamento') return 'Em andamento';
    const [a, m] = chave.split('-');
    return `${MESES[parseInt(m, 10) - 1]} de ${a}`;
  }

  function montarAbas() {
    const chaves = new Set(livros.map(chaveDoLivro));
    chaves.add('andamento');

    const lidos = [...chaves]
      .filter(c => c !== 'andamento')
      .sort()
      .reverse();

    return ['andamento', ...lidos];
  }

  function renderAbas(chaves) {
    const aside = document.getElementById('abas');
    aside.innerHTML = '<h2>Leituras</h2>';

    chaves.forEach(chave => {
      const qtd = livros.filter(l => chaveDoLivro(l) === chave).length;
      const btn = document.createElement('button');
      btn.className = 'aba' + (chave === abaAtiva ? ' ativa' : '');
      btn.innerHTML = `${nomeDaAba(chave)} <small>${qtd} livro(s)</small>`;
      btn.onclick = () => { abaAtiva = chave; render(); };
      aside.appendChild(btn);
    });
  }

  function render() {
    const chaves = montarAbas();
    if (!chaves.includes(abaAtiva)) abaAtiva = chaves[0];

    renderAbas(chaves);

    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    const indices = livros
      .map((l, i) => ({ l, i }))
      .filter(({ l }) => chaveDoLivro(l) === abaAtiva);

    if (indices.length === 0) {
      lista.innerHTML = '<div class="vazio">Nenhum livro nesta aba.</div>';
    }

    indices.forEach(({ l, i }) => {
      const pct = Math.min(100, Math.round((l.atual / l.total) * 100));
      const div = document.createElement('div');
      div.className = 'book' + (l.lido ? ' done' : '');
      div.innerHTML = `
        <strong>${escapar(l.titulo)}</strong> ${l.autor ? '— ' + escapar(l.autor) : ''}
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        <div>${l.atual} / ${l.total} páginas (${pct}%) ${l.lido ? '✅ Lido' : ''}</div>
        <div class="row">
          <label>Início
            <input type="date" value="${l.inicio || ''}" onchange="alterarData(${i}, 'inicio', this.value)">
          </label>
          <label>Fim
            <input type="date" value="${l.fim || ''}" onchange="alterarData(${i}, 'fim', this.value)">
          </label>
        </div>
        <div class="row">
          <input type="number" min="0" max="${l.total}" value="${l.atual}" style="width:100px" id="pag-${i}">
          <button onclick="atualizar(${i})">Atualizar página</button>
          <button onclick="marcarLido(${i})">Marcar como lido</button>
          <button class="danger" onclick="remover(${i})">Excluir</button>
        </div>
        <div class="datas">Início: ${formatar(l.inicio)} | Fim: ${formatar(l.fim)}</div>`;
      lista.appendChild(div);
    });

    const lidos = livros.filter(l => l.lido).length;
    document.getElementById('resumo').textContent = `Livros lidos: ${lidos} de ${livros.length}`;
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    livros.push({
      titulo: document.getElementById('titulo').value.trim(),
      autor: document.getElementById('autor').value.trim(),
      total: parseInt(document.getElementById('total').value, 10),
      atual: 0,
      lido: false,
      inicio: document.getElementById('inicio').value || '',
      fim: ''
    });
    e.target.reset();
    salvar();
  });

  function atualizar(i) {
    const l = livros[i];
    let v = parseInt(document.getElementById('pag-' + i).value, 10);
    if (isNaN(v) || v < 0) v = 0;
    if (v > l.total) v = l.total;

    if (v > 0 && !l.inicio) l.inicio = hoje();

    l.atual = v;
    l.lido = v === l.total;
    if (l.lido && !l.fim) l.fim = hoje();
    if (!l.lido) l.fim = '';
    salvar();
  }

  function marcarLido(i) {
    const l = livros[i];
    l.atual = l.total;
    l.lido = true;
    if (!l.inicio) l.inicio = hoje();
    if (!l.fim) l.fim = hoje();
    salvar();
  }

  function alterarData(i, campo, valor) {
    livros[i][campo] = valor;
    salvar();
  }

  function remover(i) {
    if (confirm('Excluir este livro?')) {
      livros.splice(i, 1);
      salvar();
    }
  }

  render();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
